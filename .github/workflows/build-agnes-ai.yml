name: Build Agnes AI Patched APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      BUILD_TOOLS_VERSION: 34.0.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt
          apktool --version
          aapt version

      - name: Extract base APK
        run: |
          mkdir -p /tmp/apk-work
          python3 -c "
          import zipfile, os
          src = 'Original-App/Agnes 3.0.47.apk+'
          dst = '/tmp/apk-work/base.apk'
          with zipfile.ZipFile(src, 'r') as z:
              z.extract('base.apk', '/tmp/apk-work')
          print('Extracted base.apk:', os.path.getsize(dst))
          "

      - name: Decompile with apktool
        run: |
          apktool d /tmp/apk-work/base.apk -o /tmp/apk-work/apktool -f

      - name: Fix duplicate resource in styles.xml
        run: |
          if [ -f /tmp/apk-work/apktool/res/values-v31/styles.xml ]; then
            sed -i '/android:windowSplashScreenBackground/d' /tmp/apk-work/apktool/res/values-v31/styles.xml
            sed -i '/android:windowSplashScreenBackground/d' /tmp/apk-work/apktool/res/values-night-v31/styles.xml
            echo "Fixed duplicate splash screen background"
          fi

      - name: Patch BuildConfig URLs
        run: |
          sed -i 's|https://api-agnes-dev\.kiwiar\.com|https://apihub.agnes-ai.com|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/BuildConfig.smali
          sed -i 's|https://api-agnes-test\.kiwiar\.com|https://apihub.agnes-ai.com|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/BuildConfig.smali
          sed -i 's|https://api-preview\.agnes-ai\.com/|https://apihub.agnes-ai.com/|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/BuildConfig.smali
          sed -i 's|https://api\.agnes-ai\.com|https://apihub.agnes-ai.com|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/BuildConfig.smali
          sed -i 's|https://agnes-test-gcp\.kiwiar\.com/|https://apihub.agnes-ai.com/|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/BuildConfig.smali
          echo "Patched BuildConfig.smali"

      - name: Patch AgnesApplication URLs
        run: |
          sed -i 's|https://api-agnes-test\.kiwiar\.com|https://apihub.agnes-ai.com|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/AgnesApplication.smali
          sed -i 's|https://api-agnes-dev\.kiwiar\.com|https://apihub.agnes-ai.com|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/AgnesApplication.smali
          sed -i 's|https://api\.agnes-ai\.com|https://apihub.agnes-ai.com|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/AgnesApplication.smali
          sed -i 's|https://api-preview\.agnes-ai\.com/|https://apihub.agnes-ai.com/|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/AgnesApplication.smali
          sed -i 's|https://agnes-test-gcp\.kiwiar\.com/|https://apihub.agnes-ai.com/|g' /tmp/apk-work/apktool/smali/com/agnes/bundle_agnes/AgnesApplication.smali
          echo "Patched AgnesApplication.smali"

      - name: Rebuild APK
        run: |
          apktool b /tmp/apk-work/apktool -o /tmp/apk-work/agnes-patched-unsigned.apk

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 \
            -alias debug -storepass android -keypass android \
            -dname "CN=Debug, OU=Dev, O=OpenAgnes, L=, S=, C=US"

      - name: Sign APK
        run: |
          aapt sign --key-pass-pass pass:android --ks-pass pass:android \
            --ks /tmp/debug.keystore --out /tmp/apk-work/agnes-patched-signed.apk \
            /tmp/apk-work/agnes-patched-unsigned.apk

      - name: Align and copy output
        run: |
          zipalign -v 4 /tmp/apk-work/agnes-patched-signed.apk /tmp/apk-work/agnes-final.apk
          mkdir -p modified
          cp /tmp/apk-work/agnes-final.apk modified/Agnes-3.0.47-AgnesAI.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Agnes-3.0.47-AgnesAI
          path: modified/Agnes-3.0.47-AgnesAI.apk
          retention-days: 7

      - name: Show APK info
        run: |
          ls -lh modified/
          echo "Build complete!"
