name: Build Agnes AI Patched APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl unzip

      - name: Download Android build-tools
        run: |
          mkdir -p /tmp/android-sdk/build-tools
          cd /tmp/android-sdk/build-tools
          curl -sSL https://dl.google.com/android/repository/build-tools/34.0.0/android-34.0.0-linux.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm build-tools.zip
          echo "/tmp/android-sdk/build-tools/android-34.0.0" >> $GITHUB_PATH
          ls -la /tmp/android-sdk/build-tools/android-34.0.0/

      - name: Extract base APK
        run: |
          mkdir -p /tmp/apk-work
          python3 -c "
          import zipfile, os
          src = 'Original-App/Agnes 3.0.47.apk+'
          dst = '/tmp/apk-work/base.apk'
          with zipfile.ZipFile(src, 'r') as z:
              z.extract('base.apk', '/tmp/apk-work')
          print('Extracted base.apk:', os.path.getsize(dst))
          "

      - name: Patch dex URLs directly in APK
        run: |
          python3 -c "
          import zipfile, os

          base_apk = '/tmp/apk-work/base.apk'
          patched_apk = '/tmp/apk-work/agnes-patched-unsigned.apk'

          replacements = [
              ('https://api.agnes-ai.com', 'https://apihub.agnes-ai.com'),
              ('https://api-preview.agnes-ai.com/', 'https://apihub.agnes-ai.com/'),
              ('https://api-agnes-dev.kiwiar.com', 'https://apihub.agnes-ai.com'),
              ('https://api-agnes-test.kiwiar.com', 'https://apihub.agnes-ai.com'),
              ('https://agnes-dev.kiwiar.com/', 'https://apihub.agnes-ai.com/'),
              ('https://agnes-test-gcp.kiwiar.com/', 'https://apihub.agnes-ai.com/'),
          ]

          with zipfile.ZipFile(base_apk, 'r') as zin:
              with zipfile.ZipFile(patched_apk, 'w', zipfile.ZIP_DEFLATED) as zout:
                  changes = 0
                  for item in zin.namelist():
                      data = zin.read(item)
                      if item.endswith('.dex') or item.endswith('.arsc') or item.endswith('.xml'):
                          for old, new in replacements:
                              old_bytes = old.encode('utf-8')
                              new_bytes = new.encode('utf-8')
                              if old_bytes in data:
                                  count = data.count(old_bytes)
                                  data = data.replace(old_bytes, new_bytes)
                                  changes += count
                                  print(f'  {item}: replaced {count}x: {old} -> {new}')
                      zout.writestr(item, data)

          print(f'Total replacements: {changes}')
          print(f'Patched APK size: {os.path.getsize(patched_apk)} bytes')
          "

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 \
            -alias debug -storepass android -keypass android \
            -dname "CN=Debug, OU=Dev, O=OpenAgnes, L=, S=, C=US"

      - name: Sign APK with apksigner
        run: |
          which apksigner
          apksigner version
          apksigner sign --ks /tmp/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out /tmp/apk-work/agnes-patched-signed.apk \
            /tmp/apk-work/agnes-patched-unsigned.apk
          apksigner verify -v /tmp/apk-work/agnes-patched-signed.apk

      - name: Align and copy output
        run: |
          zipalign -v 4 /tmp/apk-work/agnes-patched-signed.apk /tmp/apk-work/agnes-final.apk
          mkdir -p modified
          cp /tmp/apk-work/agnes-final.apk modified/Agnes-3.0.47-AgnesAI.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Agnes-3.0.47-AgnesAI
          path: modified/Agnes-3.0.47-AgnesAI.apk
          retention-days: 7

      - name: Show APK info
        run: |
          ls -lh modified/
          echo "Build complete!"
